+DirectoriesToAlwaysCook=(Path="/Game/Aurelion/VFX")

; Without explicit paths the engine scans all of /Game/ for GameplayCue notifies, which is
; every asset in the project. An asset-registry enumeration by native parent class - not by
; asset name - found cue notifies only under /Game/Cues and the Narrative fork's
; Pro/Core/Abilities/Cues, including across all marketplace content. No source in the
; project or the fork references UGameplayCueManager, AddGameplayCueNotifyPath or any
; dynamic cue registration, so the set is static.
; Scripts/Report-GameplayCueLocations.py reproduces the enumeration.
;
; ONLY /Game/Cues is scanned, deliberately. The project's cues are forked copies of the
; Narrative ones and share their GameplayCue tags. The engine's previous fallback scanned
; /Game/ alone, so the fork's copies were never registered and the project's overrides
; always won. Adding the fork root registers both, and AddGameplayCueData_Internal then
; skips whichever loses the race - observed resolving inconsistently across tags, silently
; discarding some project overrides. Listing only /Game/Cues preserves the established
; resolution exactly while still bounding the scan.
;
; A cue authored outside /Game/Cues will not resolve. Add its root here, and first confirm
; it does not duplicate a tag already served from /Game/Cues.
[/Script/GameplayAbilities.AbilitySystemGlobals]
+GameplayCueNotifyPaths="/Game/Cues"
