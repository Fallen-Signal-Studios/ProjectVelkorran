; Gather target for Project Velkorran's player-facing text.
;
; The project had no gather configuration at all, so nothing shipped could be translated even though
; the source already wraps its strings in LOCTEXT (audit UX2-08). This makes the text gatherable; it
; does not translate anything, and running the gather is an editor step - see
; Docs/EngineImplementationHandoff-2026-09-18.md.
;
; en is the native culture and the only one populated.
;
; Pseudo-localization is deliberately NOT a culture here. Listing one (qla was tried) gathers and
; archives fine and then crashes GenerateTextLocalizationResource, because pseudo-localization in
; Unreal is applied at runtime over a real culture rather than compiled as one of its own. Add real
; translation cultures to this list; do the expansion check the engine's own way.

[CommonSettings]
SourcePath=./Content/Localization/Game
DestinationPath=./Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
NativeCulture=en
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=./Source
SearchDirectoryPaths=./Plugins/Narrativeed3f9374a6eV6/Source
ExcludePathFilters=Source/ProjectVelkorranTests/*
ExcludePathFilters=*/Intermediate/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.inl
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=./Content/Aurelion/*
IncludePathFilters=./Content/Abilities/*
IncludePathFilters=./Content/Characters/*
IncludePathFilters=./Content/Framework/*
IncludePathFilters=./Content/Input/*
IncludePathFilters=./Content/PlayerCharacters/*
ExcludePathFilters=./Content/Localization/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest
ManifestName=Game.manifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive
ManifestName=Game.manifest
ArchiveName=Game.archive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource
ManifestName=Game.manifest
ArchiveName=Game.archive
ResourceName=Game.locres
